{% load static %}
{% load i18n %}

<!DOCTYPE html>
<html lang="id" class="h-100">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gagal Login Google - Neper CodingKidz</title>
    <link rel="shortcut icon" type="image/png" href="{% static 'getskills/images/favicon.png' %}">
    <link href="{% static 'getskills/css/style.css' %}" rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48;
        }
        body {
            background-image: url("{% static 'getskills/images/bg-1.jpg' %}");
            background-size: cover;
            background-position: center;
        }
        .login-card {
            border-radius: 1.25rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            background: #ffffff;
        }
        .btn-primary {
            background-color: var(--primary) !important;
            border-color: var(--primary) !important;
        }
    </style>
</head>
<body class="h-100">
    <div class="container h-100">
        <div class="row h-100 align-items-center justify-content-center">
            <div class="col-xl-5 col-lg-6 col-md-8">
                <div class="card login-card p-4 text-center">
                    <div class="card-body">
                        <div class="mb-4">
                            <a href="/" class="d-inline-flex align-items-center gap-2" style="text-decoration: none;">
                                <img src="{% static 'getskills/images/gamepad.png' %}" width="40" height="40" alt="Logo">
                                <span style="font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 800; line-height: 1.2;">
                                    <span style="color: var(--primary);">Neper</span> <span style="color: #374557;">CodingKidz</span>
                                </span>
                            </a>
                        </div>

                        <div class="mb-4">
                            <div class="d-inline-block p-3 rounded-circle bg-light-danger text-danger mb-3">
                                <i class="fas fa-exclamation-triangle fa-2x"></i>
                            </div>
                            <h4 class="font-w700 text-black">Autentikasi Google Gagal</h4>
                            <p class="text-muted fs-14 mt-2">Terjadi kendala saat mencoba masuk dengan akun Google. Pastikan email Google Anda diizinkan (Test Users) di Google Cloud Console.</p>
                        </div>

                        <a href="{% url 'getskills:login' %}" class="btn btn-primary btn-block py-3 font-w700 shadow fs-16 mb-2">Kembali ke Halaman Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
